# Shared tool settings for every project in this repository.
# Each project keeps its own runtime dependencies in projects/<name>/requirements.txt.

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "UP007",  # keep Optional[X]; X | None is fine too
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B"]

[tool.pytest.ini_options]
testpaths = ["projects"]
addopts = "--import-mode=importlib -q"
