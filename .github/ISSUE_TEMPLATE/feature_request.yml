name: 💡 Feature request or project idea
description: Suggest an improvement, or an idea for a new idle project.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      options:
        - super-lotto-simulator
        - New project idea
        - Repository-wide (docs, CI, templates)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and why it's hard today.
      placeholder: When I ..., I have to ..., which is slow because ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? For a new project, outline what it would do.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, sketches or examples.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this.
