name: 🐛 Bug report
description: Something isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search [existing issues](https://github.com/lala-wynago/random-idle/issues?q=is%3Aissue) first.

        **Please don't attach real data files or personal information.** A few anonymised or made-up rows are enough.

  - type: dropdown
    id: project
    attributes:
      label: Project
      options:
        - super-lotto-simulator
        - Repository-wide (docs, CI, templates)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `python super_lotto_simulator.py --input sample.csv`
        2. ...
        3. See the error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output or logs
      description: Paste the text. For the macOS app, the log is in ~/Library/Logs/Lotto Simulator.log.
      render: shell

  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`
      placeholder: 0cd546e

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.5 (Apple Silicon)
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python3 --version`
      placeholder: Python 3.12.3

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this hasn't been reported.
          required: true
        - label: I removed any personal data, secrets or private files from this report.
          required: true
